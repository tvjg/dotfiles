- clean: ['~']

- link:
    ~/.dotfiles: ''
    ~/.bashrc.d:
      path: bashrc.d/*
      exclude: [bashrc.d/*.noauto.sh]
      glob: true
      create: true
    ~/.bash_profile: bash_profile
    ~/.bashrc: bashrc
    ~/.emacs.d: emacs.d/
    ~/.gitconfig: gitconfig
    ~/.profile: profile
    ~/.tmux.conf: tmux.conf
    ~/.tmux: tmux/
    ~/.vim: vim/

- defaults:
    link:
      if: '[[ "$(uname)" == "Linux" ]]'

- link:
    ~/.Xresources.d:
      path: Xresources.d/*
      glob: true
      create: true
    ~/.config/htop/:
      path: config/htop/*
      glob: true
      create: true
    ~/.config/i3: config/i3
    ~/.config/moc/:
      path: config/moc/*
      glob: true
      create: true
    ~/.config/polybar: config/polybar
    ~/.config/user-dirs.dirs: config/user-dirs.dirs
    ~/.config/user-dirs.locale: config/user-dirs.locale
    ~/.Xmodmap: Xmodmap
    ~/.Xresources: Xresources
    ~/.xinitrc: xinitrc

- defaults:
    link:
      if: '[[ "$(uname)" == "Darwin" ]]'

- link:
    ~/.bashrc.d/macos-bash-completion.sh: bashrc.d/macos-bash-completion.noauto.sh

- shell:
  - [git submodule update --init --recursive, Installing submodules]

- shell:
  - mkdir -p ~/.local/bin
  - ["curl https://raw.githubusercontent.com/rupa/z/master/z.sh -o ~/.local/bin/z", Installing z]
  - chmod -R 0755 ~/.local/bin
